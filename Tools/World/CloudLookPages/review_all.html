<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Edit All Styles</title>
<style>
:root{--bg:#f4f2ee;--fg:#1d1d1f;--muted:#6b6b70;--card:#fff;--line:#dedad3;--new:#2e8b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececec;--muted:#9a9aa0;--card:#202124;--line:#33353a;--new:#6fcf97}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececec;--muted:#9a9aa0;--card:#202124;--line:#33353a;--new:#6fcf97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1500px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 18px}
h2{font-size:17px;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
figure{margin:0}
img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;display:block;background:var(--line)}
figcaption{font-size:13px;color:var(--muted);margin-top:4px}
figcaption.after{color:var(--new);font-weight:600}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="lede" id="lede"></p>
<div id="list"></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const before = q.get("before"), after = q.get("after"), view = q.get("view") || "up";
document.getElementById("title").textContent = q.get("title") || "All styles";
document.getElementById("lede").textContent = q.get("change") || "";
const styles = [["1_clear","Clear"],["2_puffs","Puffs"],["3_billows","Tall billows"],["4_broken","Broken"],["5_overcast","Overcast"],["6_storm_deck","Storm deck"]];
document.getElementById("list").innerHTML = styles.map(([k,t]) => `<section><h2>${t}</h2><div class="row">
<figure><img src="${before}/${k}_up.png" alt="${t} before, up"><figcaption>Before — looking up</figcaption></figure>
<figure><img src="${after}/${k}_up.png" alt="${t} after, up"><figcaption class="after">After — looking up</figcaption></figure>
<figure><img src="${before}/${k}_horizon.png" alt="${t} before, horizon"><figcaption>Before — horizon</figcaption></figure>
<figure><img src="${after}/${k}_horizon.png" alt="${t} after, horizon"><figcaption class="after">After — horizon</figcaption></figure>
</div></section>`).join("");
</script>
</body>
</html>
