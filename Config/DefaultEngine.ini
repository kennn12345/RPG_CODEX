[SystemSettings]
; distant non-Nanite foliage (trees, bushes, logs) stays out of the coarse virtual-shadow-map pages: fixes the
; "[VSM] Non-Nanite Marking Job Queue overflow" warning after the 2x view distances (user 2026-11-05); near shadows unchanged
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
; grass flicker (measured at the user's spot with Visual.FlickerShots, 2026-11-06): Lumen history on foliage + denser probes
r.Lumen.ScreenProbeGather.Temporal.DistanceThresholdForFoliage=100
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=32
r.Lumen.ScreenProbeGather.DownsampleFactor=8
; Grass edge stability (2026-11-05): retain more TSR samples through fine moving blades.
r.TSR.History.SampleCount=32
r.TSR.ShadingRejection.SampleCount=4
; Cloud half-resolution tracing/full-resolution reconstruction avoids the coarse
; silhouette fringe reproduced in Visual.WeatherSilhouetteAB (2026-11-08).
r.VolumetricRenderTarget.Mode=1
; Ground fog reaches the camera and uses full-resolution composition.
r.LocalFogVolume.GlobalStartDistance=0
r.LocalFogVolume.HalfResolution=0
; Keep the six-metre cap analytic: dense voxel reprojection must not leak above it.
r.LocalFogVolume.RenderIntoVolumetricFog=0
r.LocalFogVolume.TileMaxInstanceCount=256
